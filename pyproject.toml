[project]
name = "ankos"
version = "0.2.0"
description = "A small coordinate-first kernel for simple programs"
readme = "README-V2.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ca"

[tool.pytest.ini_options]
testpaths = ["tests"]
