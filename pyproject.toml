[project]
name = "ankos"
version = "0.2.0"
description = "Closed, composable simple programs inspired by A New Kind of Science"
readme = "README-V2.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ca"
